apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: deepmeshram0149/enterprise-backend:v2
        imagePullPolicy: Always

        ports:
        - containerPort: 3001

        env:
        - name: USE_LOCALHOST
          value: "false"

        - name: DB_SERVER_HOST
          value: "mysql-service"

        - name: DB_SERVER_USER
          value: "root"

        - name: DB_SERVER_PASSWORD
          value: "root123"

        - name: DB_SERVER_DATABASE
          value: "cloudcart"

        - name: PORT
          value: "3001"

        - name: JWT_SECRET_KEY_ACCESS_TOKEN
          value: "ACCESS"

        - name: JWT_SECRET_KEY_REFRESH_TOKEN
          value: "REFRESH"