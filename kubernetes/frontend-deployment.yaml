apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: enterprise-app

spec:
  replicas: 1


  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: deepmeshram0149/enterprise-frontend:v2
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        env:
        - name: REACT_APP_API_URL
          value: "http://backend-service:3001"